<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ايكوال المحاسبي</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash in dark mode.
      try {
        var t = localStorage.getItem('app_theme') || 'light';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.classList.add(t);
      } catch (e) {}
      // Same for the other appearance tokens that would otherwise flash to their default before
      // useAppearance.ts's initAppearance() runs (accent color, density, text scale).
      try {
        var root = document.documentElement;
        root.setAttribute('data-accent', localStorage.getItem('app_accent') || 'equal');
        if (localStorage.getItem('app_density') === 'compact') root.classList.add('density-compact');
        var size = Number(localStorage.getItem('app_text_size')) || 100;
        root.style.setProperty('--font-scale', String(size / 100));
        var reduceMotion = localStorage.getItem('app_reduce_motion') === 'true';
        if (reduceMotion || matchMedia('(prefers-reduced-motion: reduce)').matches) root.classList.add('motion-reduce');
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

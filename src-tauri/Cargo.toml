[package]
name = "accounting-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# The crate also ships test binaries (pdf_smoke, report_smoke, thermal_smoke, typst_spike), so
# `cargo run` / `tauri dev` need to be told which one is the app.
default-run = "accounting-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "accounting_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.1", features = ["sqlite"] }
tauri-plugin-fs = "2.5.2"
tauri-plugin-dialog = "2.7.3"

# Typst PDF engine (Phase 0 spike + Phase 11a production module,
# docs/v2/12-documents-pdf-excel.md §1-2)
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-library = "0.15.1"
typst-layout = "0.15.1"
typst-syntax = "0.15.1"
typst-utils = "0.15.1"
# SVG export for render_preview's live preview pages (§2).
typst-svg = "0.15.1"
qrcode = "0.14.1"
image = { version = "0.25", default-features = false, features = ["png"] }
ecow = "0.2"
time = "0.3"
lopdf = { version = "0.45", default-features = false, features = ["chrono-clock"] }

# Thermal printing (Phase 14, docs/v2/12-documents-pdf-excel.md §5):
# Typst SVG -> PNG rasterization (resvg/tiny-skia were already transitive
# deps of this dependency tree; promoted to direct here for
# src-tauri/src/pdf/raster.rs) -> 1-bit dither -> ESC/POS raster bytes.
resvg = "0.47"
usvg = "0.47"
tiny-skia = "0.12"

# Windows printer enumeration + raw-mode spooling (OpenPrinter/StartDocPrinter/
# WritePrinter/EndDocPrinter) for src-tauri/src/print/{printers,transport}.rs.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Graphics_Printing",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_Xps",
    "Win32_System_SystemServices",
    "Win32_Foundation",
] }

[[bin]]
name = "typst_spike"
path = "src/bin/typst_spike.rs"

[[bin]]
name = "pdf_smoke"
path = "src/bin/pdf_smoke.rs"

[[bin]]
name = "report_smoke"
path = "src/bin/report_smoke.rs"

[[bin]]
name = "thermal_smoke"
path = "src/bin/thermal_smoke.rs"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

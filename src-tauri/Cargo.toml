[workspace]
members = [".", "migration"]
resolver = "2"

[package]
name = "accounting-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# The crate also ships test binaries (pdf_smoke, report_smoke, thermal_smoke, typst_spike), so
# `cargo run` / `tauri dev` need to be told which one is the app.
default-run = "accounting-app"
# Integration tests are linked into 3 binaries instead of one per tests/*.rs file: each test binary
# links the whole app (tauri + sea-orm + typst), and 32 separate links dominated test build time.
autotests = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "accounting_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Plan 21 Part 04 B-2: `parity_host` only (see its [[bin]] entry below).
parity = ["tauri/test"]
# 2026-10-01 (dev-speed fix): gates the manual smoke/spike binaries below. Without this, a plain
# `cargo build --release` / `tauri build` compiled all 4 of them too — each one separately links
# the full Typst + sea-orm + tauri dependency graph under release's `lto = true` +
# `codegen-units = 1`, which turned one release build into 5 full-LTO link units and was observed
# to exhaust LLVM's memory (`rustc-LLVM ERROR: out of memory`) on a `tauri build`. Run a smoke
# binary explicitly with `cargo run --features smoke-bins --bin pdf_smoke` (etc.) when needed.
smoke-bins = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2.5.2"
tauri-plugin-dialog = "2.7.3"
migration = { path = "migration" }

# 21.02-A — real backend foundation (MariaDB via SeaORM). Reached only through `sea_orm::sqlx` to
# avoid sqlx version skew (P2-01/A-1).
sea-orm = { version = "1", features = [
    "sqlx-mysql",
    "runtime-tokio-rustls",
    "macros",
    "with-rust_decimal",
    "with-chrono",
    "with-uuid",
    "with-json",
] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
rust_decimal_macros = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
argon2 = "0.5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
thiserror = "2"
serde_with = "3"
async-trait = "0.1"
log = "0.4"
tokio = { version = "1", features = ["macros", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
# Diagnostics (18.B3): captures Rust-side panics/logs into the same app-log directory that
# diag_* (src/diag/mod.rs) writes the TypeScript-side channels into.
tauri-plugin-log = "2"

# Typst PDF engine (Phase 0 spike + Phase 11a production module,
# docs/v2/12-documents-pdf-excel.md §1-2)
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-library = "0.15.1"
typst-layout = "0.15.1"
typst-syntax = "0.15.1"
typst-utils = "0.15.1"
# SVG export for render_preview's live preview pages (§2).
typst-svg = "0.15.1"
qrcode = "0.14.1"
image = { version = "0.25", default-features = false, features = ["png"] }
ecow = "0.2"
time = "0.3"
lopdf = { version = "0.45", default-features = false, features = ["chrono-clock"] }

# Thermal printing (Phase 14, docs/v2/12-documents-pdf-excel.md §5):
# Typst SVG -> PNG rasterization (resvg/tiny-skia were already transitive
# deps of this dependency tree; promoted to direct here for
# src-tauri/src/pdf/raster.rs) -> 1-bit dither -> ESC/POS raster bytes.
resvg = "0.47"
usvg = "0.47"
tiny-skia = "0.12"

# 21.02-A2/A3 — bundled MariaDB (D11): one app instance per PC (P2-58), Main-PC autostart when LAN
# sharing is on (A3), and OS-random secrets for the DB accounts (P2-49).
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
getrandom = "0.3"
# 21.02-F — typed TS bindings generated from Rust DTOs (P2-01). No decimal impl on purpose: a
# `Decimal` field without `#[ts(type = "number")]` must fail to compile (phase-f F-1).
ts-rs = { version = "12.0.1", features = ["uuid-impl", "chrono-impl"] }

# 21.03 Wave 0 (G-33): insertion-ordered map + stable sort, the exact equivalent of every mock
# group-by (a JS `Map` followed by `Array.prototype.sort`). Version pinned to what `hayagriva`
# (a typst dependency, see Cargo.lock) already resolves to, so this stays one copy in the tree.
indexmap = "2"

# 21.03 Wave 0 (G-34): `utils::text::compare_ar` — Arabic `localeCompare` port for reports/analytics
# sorts (13-reports rs:433 etc.) via ICU4X's compiled `ar` collation data. `hayagriva` (a typst
# dependency) already pulls in `icu_collator 2.3.1` transitively (see Cargo.lock); pinning the same
# version here keeps this a direct dependency without a second copy in the tree. `icu_locale_core`
# builds the `LanguageIdentifier` the collator preferences need and is already in the tree at 2.3.0
# (a dependency of `icu_collator`/`icu_locale` themselves).
icu_collator = "2.3.1"
icu_locale_core = "2.3.0"

# 21.03 Wave 0 (G-47, backup/restore — `infrastructure/backup/`, P2-52): the backup archive format
# is a password-protected zip (`zip`), each file inside AEAD-encrypted with AES-256-GCM (`aes-gcm`),
# the passphrase stretched with PBKDF2-HMAC-SHA256 (`pbkdf2` + `sha2`), and the resulting binary blobs
# safe to embed in the manifest/report JSON via `base64`.
zip = "2"
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
base64 = "0.22"

# Windows printer enumeration + raw-mode spooling (OpenPrinter/StartDocPrinter/
# WritePrinter/EndDocPrinter) for src-tauri/src/print/{printers,transport}.rs.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Graphics_Printing",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_Xps",
    "Win32_System_SystemServices",
    "Win32_Foundation",
    # 21.02-A2 (bundled MariaDB supervisor, ProgramData path, session-end hook, disk space) and
    # A3 (computer name for pairing, elevated netsh via ShellExecuteExW).
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_Shutdown",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_System_Registry",
    "Win32_Networking_WinSock",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "typst_spike"
path = "src/bin/typst_spike.rs"
required-features = ["smoke-bins"]

[[bin]]
name = "pdf_smoke"
path = "src/bin/pdf_smoke.rs"
required-features = ["smoke-bins"]

[[bin]]
name = "report_smoke"
path = "src/bin/report_smoke.rs"
required-features = ["smoke-bins"]

[[bin]]
name = "thermal_smoke"
path = "src/bin/thermal_smoke.rs"
required-features = ["smoke-bins"]

# Plan 21 Part 04 B-2/B-4: the parity host runs the app's real command list on Tauri's
# `MockRuntime` (`tauri::test`), for `bun run parity`. Built only with `--features parity`, so a
# normal build never compiles tauri's `test` feature.
[[bin]]
name = "parity_host"
path = "src/bin/parity_host.rs"
required-features = ["parity"]

# Every DB-backed and static-rule suite (tests/all/main.rs pulls in each tests/*.rs as a module).
[[test]]
name = "all"
path = "tests/all/main.rs"

# The two bundled-server suites start/stop their own MariaDB processes and ports, so they stay in
# their own binaries (cargo runs test binaries one after another, never side by side).
[[test]]
name = "db_server_lifecycle"
path = "tests/db_server_lifecycle.rs"

[[test]]
name = "db_server_lan"
path = "tests/db_server_lan.rs"


# Dev-build footprint (user request 2026-09-27: builds froze the PC). Full debug info for typst/
# tauri/sea-orm made every linked test binary multi-GB and link.exe RAM-hungry. Keep line tables
# for our own crate (readable backtraces) and no debug info for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
